<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#f4f6fb" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="今日课表" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
  <link rel="stylesheet" href="./styles.css" />
  <title>今日课表</title>
</head>
<body>
  <main class="app-shell">
    <header class="topbar">
      <div class="topbar-copy">
        <div class="eyebrow" id="semesterLabel">加载中…</div>
        <h1 id="headline">今天</h1>
      </div>
      <button class="today-button" id="todayBtn" type="button" aria-label="回到今天">今</button>
    </header>

    <section class="date-toolbar" aria-label="日期选择">
      <button class="week-arrow" id="prevWeekBtn" type="button" aria-label="上一周">‹</button>
      <div class="date-strip" id="dateStrip"></div>
      <button class="week-arrow" id="nextWeekBtn" type="button" aria-label="下一周">›</button>
    </section>

    <section id="todayView" class="view active">
      <div class="date-summary">
        <div>
          <div class="date-title" id="dateTitle"></div>
          <div class="date-subtitle" id="dateSubtitle"></div>
        </div>
        <button class="plain-btn" id="pickDateBtn" type="button">选日期</button>
        <input id="datePicker" type="date" hidden />
      </div>

      <div class="holiday-banner" id="holidayBanner" hidden></div>

      <section class="hero-card" id="heroCard" aria-live="polite"></section>

      <section class="section-block">
        <div class="section-heading">
          <h2>当天课程</h2>
          <span id="courseCount"></span>
        </div>
        <div id="courseList" class="course-list"></div>
      </section>

      <button class="next-day-card" id="nextDayCard" type="button"></button>
    </section>

    <section id="weekView" class="view">
      <div class="week-title-row">
        <div>
          <h2>本周课表</h2>
          <p id="weekRange"></p>
        </div>
        <button class="plain-btn" id="weekTodayBtn" type="button">本周</button>
      </div>
      <div id="weekList" class="week-list"></div>
    </section>

    <section id="aboutView" class="view">
      <div class="about-card">
        <div class="about-icon">✓</div>
        <h2>课表已同步</h2>
        <p>打开时会自动检查最新课表；没有网络时也可以继续查看最近一次成功加载的数据。</p>
      </div>

      <div class="info-list">
        <div><span>学期</span><strong id="infoSemester">—</strong></div>
        <div><span>第一周</span><strong id="infoStart">—</strong></div>
        <div><span>课表更新</span><strong id="infoUpdated">—</strong></div>
        <div><span>打开方式</span><strong id="infoMode">—</strong></div>
      </div>

      <button class="action-card" id="refreshBtn" type="button">
        <span><strong>检查课表更新</strong><small id="refreshState">联网时会获取最新数据</small></span><span class="arrow">›</span>
      </button>

      <div class="notice-card" id="installCard" hidden>
        <strong>建议添加到主屏幕</strong>
        <p>在 iPhone 的 Safari 中点“分享” → “添加到主屏幕”。之后可以像普通 App 一样直接打开。</p>
      </div>

      <div class="notice-card subtle-card">
        <strong>关于节假日和调课</strong>
        <p>法定节假日只用于提示；是否停课、补课或换教室，以学校实际教学安排为准。已确认的变化会自动显示在这里。</p>
      </div>

      <div class="version-line">今日课表 · v0.5</div>
    </section>
  </main>

  <nav class="bottom-nav" aria-label="主导航">
    <button class="nav-item active" data-view="todayView" type="button"><span class="nav-glyph">●</span><span>今天</span></button>
    <button class="nav-item" data-view="weekView" type="button"><span class="nav-glyph">▦</span><span>本周</span></button>
    <button class="nav-item" data-view="aboutView" type="button"><span class="nav-glyph">···</span><span>更多</span></button>
  </nav>

  <div class="toast" id="toast" role="status"></div>
  <script type="module" src="./app.js"></script>
</body>
</html>
